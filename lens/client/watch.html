<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- YouTube's own embedded player, as any site (Google Slides among them)
     puts a video in a page: YouTube's IFrame API, its player unchanged, the
     video coming from YouTube to this computer. Nothing here goes through
     lens, and nothing is hidden: it is YouTube's player, saying so. -->
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Video</title>
<style>
html,body{margin:0;height:100%;background:#0b0c0d;color:#ddd;font:14px/1.45 system-ui,sans-serif}
#wrap{position:absolute;inset:0;display:flex;flex-direction:column}
#player{flex:1;min-height:0}
#player iframe{width:100%;height:100%;border:0;display:block}
#note{display:none;max-width:560px;margin:auto;padding:24px}
#note h2{margin:0 0 8px;font-size:18px}
#note a{color:#8fd18f}
</style>
</head>
<body>
<div id="wrap">
  <div id="player"></div>
  <div id="note"><h2 id="head"></h2><p id="say"></p><p><a id="out" target="_blank" rel="noopener">Open it on YouTube</a></p></div>
</div>
<script src="watch.js"></script>
</body>
</html>
